<header class="navbar">
  <div class="navbar-inner container">
    <a routerLink="/mera/home" class="navbar-brand">Mera</a>

    <nav class="navbar-links" aria-label="Main navigation">
      @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path"
         routerLinkActive="navbar-link-active"
         class="navbar-link">
        {{ link.label }}
      </a>
      }
    </nav>

    <div class="navbar-actions">

      <a routerLink="/survey" class="navbar-link navbar-survey-link">Survey</a>

      @if (authService.isResearcher()) {
      <div class="tools-dropdown">
        <button type="button"
                class="btn btn-secondary navbar-tools-toggle"
                (click)="toggleTools()">
          UX Lens Tools ▾
        </button>
        @if (toolsOpen()) {
        <div class="tools-menu" role="menu">
          @for (link of toolLinks; track link.path) {
          <a [routerLink]="link.path"
             routerLinkActive="tools-link-active"
             class="tools-link"
             (click)="closeTools()">
            {{ link.label }}
          </a>
          }
        </div>
        }
      </div>

      <button type="button"
              class="btn btn-secondary navbar-mode-toggle"
              (click)="toggleUxMode()">
        {{ uxModeService.isPoorMode() ? 'Poor UX Mode' : 'Good UX Mode' }}
      </button>

      <button type="button"
              class="btn navbar-dev-toggle"
              (click)="toggleDevMode()"
              aria-label="Toggle developer panel">
        Dev Mode
      </button>
      }

      @if (authService.isLoggedIn()) {
      <button type="button" class="btn btn-secondary navbar-signout" (click)="signOut()">
        Sign Out
      </button>
      }

    </div>
  </div>
</header>
