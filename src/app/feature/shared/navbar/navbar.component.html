<header class="navbar">
  <div class="navbar-inner container">

    <a routerLink="/mera/home" class="navbar-brand">
      Mera
    </a>

    <nav class="navbar-links" aria-label="Main navigation">
      @for (link of navLinks; track link.path) {
      <a [routerLink]="link.path"
         routerLinkActive="navbar-link-active"
         [routerLinkActiveOptions]="{ exact: true }"
         class="navbar-link">
        {{ link.label }}
      </a>
      }
    </nav>

    <div class="navbar-actions">

      <button type="button"
              class="notification-button"
              aria-label="Notifications">
        🔔
      </button>

      @if (authService.isLoggedIn()) {
      <div class="profile-wrapper" (clickOutside)="closeProfile()">

        <button type="button"
                class="profile-button"
                [class.profile-button-open]="profileOpen()"
                (click)="toggleProfile()"
                aria-label="Profile menu">
          <span class="profile-avatar">
            {{ authService.currentUser()?.displayName?.charAt(0) ?? 'U' }}
          </span>
          <span class="profile-label">
            {{ (authService.currentUser()?.displayName ?? 'Profile').split(' ')[0] }}
          </span>
          <span class="profile-chevron">{{ profileOpen() ? '▲' : '▼' }}</span>
        </button>

        @if (profileOpen()) {
        <div class="profile-dropdown" role="menu">
          <a routerLink="/mera/profile"
             class="dropdown-item"
             (click)="closeProfile()">
            <span>👤</span> My Profile
          </a>
          <div class="dropdown-divider"></div>
          <button type="button"
                  class="dropdown-item dropdown-signout"
                  (click)="signOut()">
            <span>🚪</span> Sign Out
          </button>
        </div>
        }

      </div>
      }

    </div>

  </div>
</header>
