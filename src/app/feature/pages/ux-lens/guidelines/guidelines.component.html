<section class="container guidelines-section">
  <h1>UX Guidelines</h1>
  <p class="text-muted">
    The design issues demonstrated in Mera's Poor UX Mode are grounded in the following
    established usability and accessibility principles.
  </p>

  <div class="principle-list">
    @for (principle of principles; track principle.title) {
    <div class="card principle-card">
      <h2>{{ principle.title }}</h2>
      <p class="text-muted"><em>{{ principle.source }}</em></p>
      <p>{{ principle.summary }}</p>
    </div>
    }
  </div>
</section>
