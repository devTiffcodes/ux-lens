<main class="courses-page" [class.poor-ux]="uxModeService.isPoorMode()">

  <section class="container courses-hero">
    <div>
      <p class="page-eyebrow">Semester 2 · 2026</p>
      <h1>My Courses</h1>
      <p class="page-subtitle">Your enrolled modules for this semester.</p>
    </div>
  </section>

  <section class="container">
    <div class="courses-grid">
      @for (course of courses; track course.id) {
      <div class="course-card card">
        <div class="course-card-top" [style.background]="course.color">
          <span class="course-code">{{ course.code }}</span>
        </div>
        <div class="course-card-body">
          <h2 class="course-title">{{ course.title }}</h2>
          <p class="course-lecturer">👤 {{ course.lecturer }}</p>
          <p class="course-schedule">🕐 {{ course.schedule }}</p>
          <p class="course-room">📍 {{ course.room }}</p>

          <div class="course-progress-wrap">
            <div class="course-progress-label">
              <span>Progress</span>
              <span>{{ course.progress }}%</span>
            </div>
            <div class="course-progress-bar">
              <div class="course-progress-fill" [style.width]="course.progress + '%'"></div>
            </div>
          </div>

          <div class="course-footer">
            <span class="course-credits">{{ course.credits }} credits</span>
            <button class="btn btn-sm">View Materials</button>
          </div>
        </div>
      </div>
      }
    </div>
  </section>

</main>
