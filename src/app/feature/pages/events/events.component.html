<section class="container">
  <h1>Events</h1>
  <ul class="event-list">
    @for (event of displayEvents(); track event.id) {
    <li class="card event-card">
      <div class="event-date">{{ event.displayDate }}</div>
      <div>
        <h2>{{ event.title }}</h2>
        <p class="text-muted">{{ event.location }}</p>
        <p>{{ event.description }}</p>
      </div>
    </li>
    }
  </ul>
</section>
