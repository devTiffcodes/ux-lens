<main class="events-page" [class.poor-ux]="uxModeService.isPoorMode()">

  <section class="events-hero container">
    <div>
      <p class="page-eyebrow">Campus Life</p>
      <h1>Events</h1>
      <p class="page-subtitle">Discover what's happening at UNISEY this semester.</p>
    </div>

    <div class="events-filter">
      <button class="filter-btn active">All</button>
      <button class="filter-btn">Academic</button>
      <button class="filter-btn">Social</button>
      <button class="filter-btn">Career</button>
    </div>
  </section>

  <section class="container events-grid-section">
    <div class="events-grid">
      @for (event of displayEvents(); track event.id) {
      <div class="event-card card">
        <div class="event-card-header" [style.background]="event.color">
          <span class="event-category">{{ event.category }}</span>
        </div>
        <div class="event-card-body">
          <div class="event-date-badge">
            <span class="event-day">{{ event.day }}</span>
            <span class="event-month">{{ event.month }}</span>
          </div>
          <h2 class="event-title">{{ event.title }}</h2>
          <p class="event-location">📍 {{ event.location }}</p>
          <p class="event-desc">{{ event.description }}</p>
          <div class="event-footer">
            <span class="event-time">🕐 {{ event.time }}</span>
            <button class="btn btn-sm">RSVP</button>
          </div>
        </div>
      </div>
      }
    </div>
  </section>

</main>
