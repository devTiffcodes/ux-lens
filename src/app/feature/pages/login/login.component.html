<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-name">UX Lens</span>
      <p class="brand-sub">Mera Research Platform</p>
    </div>

    <h1>Sign in to continue</h1>
    <p class="text-muted">Participants and researchers both sign in here. Your role is assigned automatically.</p>

    @if (error()) {
    <p class="field-error">{{ error() }}</p>
    }

    <button type="button" class="btn btn-google" (click)="signInWithGoogle()" [disabled]="isLoading()">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z" />
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z" />
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18z" />
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z" />
      </svg>
      {{ isLoading() ? 'Signing in...' : 'Continue with Google' }}
    </button>

    <p class="login-note text-muted">By signing in you agree to participate in the UX Lens research study.</p>
  </div>
</div>
